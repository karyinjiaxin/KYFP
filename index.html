<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth Platform</title>
<link rel="stylesheet" href="css/styles.css">
<!-- Tenorite (requested) is a Microsoft-exclusive font not licensed for
     general web embedding, so it's not loaded here — Inter is used
     instead as a free, properly-licensed alternative in a similar clean,
     modern style, loaded via Google Fonts so it renders consistently on
     any device rather than depending on local installation. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-area">
    <div class="topbar">
      <div class="client-chip">
        <div class="avatar" id="topClientInitials">—</div>
        <div>
          <div style="font-weight:700;font-size:14.5px" id="topClientName">Loading…</div>
          <div class="text-secondary" style="font-size:12px" id="topClientMeta">—</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--text-tertiary);align-self:center;margin-left:8px" title="Build identifier — check this matches what you expect after extracting a new file">Build 20260918-033422</div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="quickSaveBtn" title="Save this client so you can come back to it later">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          <span id="quickSaveLabel">Save</span>
        </button>
        <button class="btn btn-secondary btn-sm" id="newClientBtn" title="Save this client, then start a fresh blank one">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New Client
        </button>
        <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="printBtn" title="Print / Export">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
        </button>
      </div>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- Core -->
<script src="js/core/state.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/calculations.js"></script>
<script src="js/core/sgTax.js"></script>
<script src="js/core/fields.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/sidebar.js"></script>
<script src="js/core/router.js"></script>

<!-- Data -->
<script src="js/data/sampleClient.js"></script>
<script src="js/data/blankClient.js"></script>

<!-- Modules -->
<script src="js/modules/charts.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/couple.js"></script>
<script src="js/modules/roadmap.js"></script>
<script src="js/modules/cashflow.js"></script>
<script src="js/modules/buckets.js"></script>
<script src="js/modules/networth.js"></script>
<script src="js/modules/insurance.js"></script>
<script src="js/modules/hospitalPlans.js"></script>
<script src="js/modules/retirement.js"></script>
<script src="js/modules/investments.js"></script>
<script src="js/modules/dividends.js"></script>
<script src="js/modules/cpf.js"></script>
<script src="js/modules/tax.js"></script>
<script src="js/modules/estate.js"></script>
<script src="js/modules/ratios.js"></script>
<script src="js/modules/goals.js"></script>
<script src="js/modules/profile.js"></script>
<script src="js/modules/sessionNotes.js"></script>
<script src="js/modules/meetingNotes.js"></script>
<script src="js/modules/proposals.js"></script>
<script src="js/modules/settings.js"></script>

<!-- Bootstrap -->
<script src="js/app.js"></script>
</body>
</html>
