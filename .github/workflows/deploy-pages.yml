name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: |
          set -x
          pwd
          SHA=$(git rev-parse --short HEAD)
          TIME=$(date -u +"%-d %b, %H:%M UTC")
          printf 'var APP_VERSION = { sha: %s, time: %s };\n' "$(node -e "console.log(JSON.stringify(process.argv[1]))" "$SHA")" "$(node -e "console.log(JSON.stringify(process.argv[1]))" "$TIME")" > js/core/version.js
          echo "--- js/core/version.js after stamping ---"
          cat js/core/version.js
          echo "--- end ---"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
